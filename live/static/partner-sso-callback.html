<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signing in · GLOW Ops</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="/app/tokens.css?v=lux-40" />
  <link rel="stylesheet" href="/app/styles.css?v=lux-40" />
  <link rel="stylesheet" href="/app/partner.css?v=lux-40" />
</head>
<body class="shell partner-shell partner-auth">
  <div class="glow-welcome" id="glowWelcome">
    <div class="glow-welcome-inner">
      <div class="glow-orb" aria-hidden="true"></div>
      <p>Welcome to GLOW Ops.</p>
    </div>
  </div>
  <main class="workspace login-fit" id="authMain" hidden>
    <div class="login-card">
      <p class="hint" id="err"></p>
    </div>
  </main>
  <script src="/app/clerk-partner.js?v=lux-40"></script>
  <script>
    (async () => {
      const err = document.getElementById("err");
      try {
        const cfg = await GlowClerkPartner.fetchPublicConfig();
        const clerk = await GlowClerkPartner.createClerk(cfg.clerk.publishableKey);
        if (typeof clerk.handleRedirectCallback === "function") {
          await clerk.handleRedirectCallback({
            afterSignInUrl: GlowClerkPartner.AFTER,
            afterSignUpUrl: GlowClerkPartner.AFTER,
          });
        }
        location.replace(GlowClerkPartner.AFTER);
      } catch (e) {
        err.textContent = String(e.message || e);
        setTimeout(() => location.replace("/partner/sign-in"), 2500);
      }
    })();
  </script>
</body>
</html>
