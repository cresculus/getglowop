<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signing in · GlowOps</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet" />
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="/app/tokens.css?v=lux-27" />
  <link rel="stylesheet" href="/app/styles.css?v=lux-27" />
  <link rel="stylesheet" href="/app/partner.css?v=lux-27" />
  <link rel="stylesheet" href="/app/shell.css?v=lux-27" />
</head>
<body class="shell partner-shell partner-auth">
  <main class="workspace login-fit">
    <div class="login-card">
      <p class="pane-label"><span class="live"></span> Partner console</p>
      <h1>Signing in…</h1>
      <p class="lede" id="lede">Finishing Google / Microsoft sign-in.</p>
      <p class="hint" id="err"></p>
    </div>
  </main>
  <script src="/app/clerk-partner.js?v=lux-27"></script>
  <script>
    (async () => {
      const err = document.getElementById("err");
      try {
        const cfg = await GlowClerkPartner.fetchPublicConfig();
        const clerk = await GlowClerkPartner.createClerk(cfg.clerk.publishableKey);
        if (typeof clerk.handleRedirectCallback === "function") {
          await clerk.handleRedirectCallback({
            afterSignInUrl: GlowClerkPartner.AFTER,
            afterSignUpUrl: GlowClerkPartner.AFTER,
          });
        }
        location.replace(GlowClerkPartner.AFTER);
      } catch (e) {
        err.textContent = String(e.message || e);
        setTimeout(() => location.replace("/partner/sign-in"), 2500);
      }
    })();
  </script>
</body>
</html>
