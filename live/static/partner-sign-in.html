<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · GlowOps Partner</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app/tokens.css?v=lux-28" />
  <link rel="stylesheet" href="/app/styles.css?v=lux-28" />
  <link rel="stylesheet" href="/app/partner.css?v=lux-28" />
  <link rel="stylesheet" href="/app/shell.css?v=lux-28" />
</head>
<body class="shell partner-shell partner-auth">
  <header class="topbar">
    <a class="wordmark" href="/partner/"><svg class="mark" width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M25.7 13.4A10 10 0 1 1 18.6 6.3" stroke="currentColor" stroke-width="2.7"/><path d="M13.2 13.4H25.4" stroke="currentColor" stroke-width="2.7"/><rect x="19.2" y="5.5" width="7.1" height="7.1" fill="currentColor"/></svg>GLOW&nbsp;Ops</a>
    <nav class="rail">
      <a class="btn ghost" href="/partner/sign-up">Sign up</a>
    </nav>
  </header>
  <main class="workspace login-fit">
    <div class="login-card login-card-auth">
      <p class="pane-label"><span class="live"></span> Partner console</p>
      <div id="clerkMount" class="clerk-mount"></div>
      <p class="hint" id="authErr"></p>
      <p class="hint">Email, Google, and Microsoft use Clerk. Google/Microsoft need SSO enabled in Clerk → Configure → SSO. Allow redirects (not just popups).</p>
    </div>
  </main>
  <script src="/app/clerk-partner.js?v=lux-28"></script>
  <script>
    (async () => {
      const err = document.getElementById("authErr");
      const mount = document.getElementById("clerkMount");
      try {
        const cfg = await GlowClerkPartner.fetchPublicConfig();
        if (!cfg.clerk?.enabled || !cfg.clerk.publishableKey) {
          err.textContent = "Clerk is not configured on this host yet.";
          return;
        }
        const clerk = await GlowClerkPartner.createClerk(cfg.clerk.publishableKey);
        if (clerk.session) {
          location.replace(GlowClerkPartner.AFTER);
          return;
        }
        GlowClerkPartner.mountSignIn(clerk, mount);
        clerk.addListener(({ session }) => {
          if (session) location.replace(GlowClerkPartner.AFTER);
        });
      } catch (e) {
        err.textContent = String(e.message || e);
      }
    })();
  </script>
</body>
</html>
