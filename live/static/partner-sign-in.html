<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light only" />
  <title>Sign in · GlowOps Partner</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app/styles.css?v=clerk-2" />
  <link rel="stylesheet" href="/app/partner.css?v=clerk-2" />
</head>
<body class="shell partner-shell partner-auth">
  <header class="topbar">
    <a class="wordmark" href="/partner/"><span class="dot"></span>GLOW&nbsp;Ops</a>
    <nav class="rail">
      <a class="btn ghost" href="/partner/sign-up">Sign up</a>
    </nav>
  </header>
  <main class="workspace login-fit">
    <div class="login-card">
      <p class="pane-label"><span class="live"></span> Partner console</p>
      <h1>Sign in</h1>
      <p class="lede">Access your portfolio, enroll devices, and open fleet reports.</p>
      <div id="clerkMount" class="clerk-mount"></div>
      <p class="hint" id="authErr"></p>
      <p class="hint auth-switch">No account? <a href="/partner/sign-up">Sign up</a></p>
    </div>
  </main>
  <script src="/app/clerk-partner.js?v=clerk-2"></script>
  <script>
    (async () => {
      const err = document.getElementById("authErr");
      const mount = document.getElementById("clerkMount");
      try {
        const cfg = await GlowClerkPartner.fetchPublicConfig();
        const clerkCfg = cfg.clerk || {};
        if (!clerkCfg.enabled || !clerkCfg.publishableKey) {
          err.textContent = "Clerk is not configured on this host yet.";
          return;
        }
        const clerk = await GlowClerkPartner.createClerk(clerkCfg.publishableKey);
        if (clerk.session) {
          location.replace(GlowClerkPartner.AFTER);
          return;
        }
        GlowClerkPartner.mountSignIn(clerk, mount);
        clerk.addListener(({ session }) => {
          if (session) location.replace(GlowClerkPartner.AFTER);
        });
      } catch (e) {
        err.textContent = String(e.message || e);
      }
    })();
  </script>
</body>
</html>
